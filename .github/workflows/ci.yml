name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Verify retained reference fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check pinned official corpus
        run: python3 tools/conformance.py check
      - name: Check pinned Core 2 corpus and migration assertions
        run: python3 tools/extensions.py check
      - name: Check retained WASI compiler and ABI fixtures
        run: python3 tools/wasi_fixtures.py check
      - name: Check independent reference outcomes
        run: python3 tools/differential.py check

  verify:
    needs: fixtures
    uses: gomlang/verification/.github/workflows/ecosystem-ci.yml@9a33705bb3d702533e57a382279c8f190fde0e58
    with:
      module: wasm
      verification-ref: 9a33705bb3d702533e57a382279c8f190fde0e58
